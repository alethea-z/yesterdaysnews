baseURL = "https://alethea-z.github.io/yesterdaysnews/"
languageCode = "de-de"
title = "yesterdaysnews"
theme = "hugo-theme-stack"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[params]
  description = "Kuratierte Nachrichten: langsam, quellenbasiert, mit Tags und Journal."
  mainSections = ["journal"]
  [params.sidebar]
    subtitle = "Relevante Nachrichten, ruhig kuratiert"
    avatar = "img/logo.png"
    emoji = "🦊"

[widgets]
  homepage = [
    { type = "archives", params = { limit = 5 } },
    { type = "categories", params = { limit = 10 } },
    { type = "tag-cloud", params = { limit = 10 } },
  ]
  page     = [{ type = "toc" }]

[menu]

  [[menu.main]]
    name = "Start"
    url = "/"
    weight = 10

  [[menu.main]]
    name = "Journal"
    url = "/journal/"
    weight = 20

  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 30

  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 40

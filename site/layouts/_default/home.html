{{ define "main" }}
  <section class="hero">
    <h1>{{ .Title }}</h1>
    <p>{{ .Content }}</p>
  </section>

  <section>
    <div class="section-heading">
      <h2>Neueste Einträge</h2>
      <a href="/journal/">Zum Journal</a>
    </div>
    <div class="post-list">
      {{ range first 5 (where site.RegularPages "Section" "journal") }}
        <article class="post-card">
          <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
          <p class="meta">{{ .Date.Format "02.01.2006" }} · {{ with .Params.tags }}{{ delimit . ", " }}{{ end }}</p>
          <p>{{ .Summary }}</p>
        </article>
      {{ end }}
    </div>
  </section>
{{ end }}

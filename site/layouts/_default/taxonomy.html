{{ define "main" }}
  <header class="list-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <article class="post-card">
        <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
        <p class="meta">{{ .Date.Format "02.01.2006" }}</p>
        <p>{{ .Summary }}</p>
      </article>
    {{ end }}
  </div>
{{ end }}
